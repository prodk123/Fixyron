version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fixyron-postgres
    environment:
      POSTGRES_USER: fixyron
      POSTGRES_PASSWORD: fixyron_password
      POSTGRES_DB: fixyron_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixyron -d fixyron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixyron-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fixyron:fixyron_password@postgres:5432/fixyron_db
      - FRONTEND_URL=http://localhost:3000
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /tmp/fixyron-workspaces:/tmp/fixyron-workspaces
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixyron-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
